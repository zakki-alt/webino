<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Datang di Web Ino</title>
    <style>
        /* Mengatur dasar halaman */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Desain kotak kartu ucapan */
        .welcome-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        /* Desain Judul */
        .welcome-card h1 {
            color: #0984e3;
            margin-bottom: 15px;
            font-size: 2rem;
        }

        /* Desain Teks Pendukung */
        .welcome-card p {
            color: #636e72;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* Desain Tombol Interaktif */
        .btn-explore {
            display: inline-block;
            padding: 12px 30px;
            background-color: #0984e3;
            color: #fff;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        /* Efek saat tombol diarahkan kursor (hover) */
        .btn-explore:hover {
            background-color: #74b9ff;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(9, 132, 227, 0.4);
        }
    </style>
</head>
<body>

    <!-- Konten Utama -->
    <div class="welcome-card">
        <h1>Selamat Datang!</h1>
        <p>Halo! Terima kasih telah berkunjung di <strong>Web Ino</strong>. Tempat terbaik untuk menjelajahi ide-ide kreatif dan inspirasi baru.</p>
        <a href="#" class="btn-explore" onclick="alert('Halo! Selamat menjelajahi Web Ino!')">Jelajahi Sekarang</a>
    </div>

</body>
</html>
